<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Текущий РП - Растущий Поток</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 16px;
            max-width: 430px;
            margin: 0 auto;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 10px 0 25px;
        }

        .back-btn {
            position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            background: #334155; color: white; border: none; border-radius: 12px;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; text-decoration: none;
        }

        .home-btn {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: #334155;
            color: white;
            border: none;
            border-radius: 12px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .home-btn:active {
            background: #475569;
            transform: translateY(-50%) scale(0.9);
        }

        h2 { margin: 0; font-size: 1.4rem; color: #c4d0ff; text-align: center; }

        .card {
            background: #1e2937; border-radius: 18px; padding: 20px;
            margin-bottom: 22px; width: 100%; box-sizing: border-box;
        }

        .input-label { display: block; margin: 12px 0 6px; color: #94a3b8; font-size: 0.97rem; }
        
        .deposit-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }

        .deposit-input {
            flex: 1; padding: 16px 14px; background: #334155;
            border: 2px solid #24a484; border-radius: 14px;
            color: white; font-size: 1.1rem; text-align: center;
        }

        .currency-select {
            flex: 1;
            padding: 16px 10px;
            background: #334155;
            border: 2px solid #24a484;
            border-radius: 14px;
            color: white;
            font-size: 1.1rem;
            text-align: center;
        }

        .note {
            font-size: 0.86rem;
            color: #64748b;
            margin-top: 10px;
        }

        table {
            width: 100%; border-collapse: collapse; background: #1e2937;
            font-size: 10px; border-radius: 14px; overflow: hidden; table-layout: fixed;
        }

        th, td { padding: 8px 2px; text-align: center; border-bottom: 1px solid #475569; }
        th { background: #334155; color: #c4d0ff; }

        .pct { color: #a5b4fc; }
        .vpotoke { color: #fbbf24; }
        .opening-row { background-color: #334155 !important; font-weight: bold; }
        .nach { color: #34d399; font-weight: bold; }
        .koshelek { color: #60a5fa; font-weight: bold; }

        .error { 
            color: #f87171; 
            font-size: 0.9rem; 
            margin-top: 8px; 
            text-align: center; 
            display: none; 
        }
    </style>
</head>
<body>

    <div class="header-container">
        <a href="growing.html" class="back-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
        
        <h2>Текущий РП</h2>

        <a href="index.html" class="home-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>
    </div>

    <div class="card">
        <label class="input-label">В потоке</label>
        <div class="deposit-row">
            <input type="number" id="vpotoke" class="deposit-input" value="531427.84" oninput="calculateCurrent()">
            <select id="currency" class="currency-select" onchange="calculateCurrent()">
                <option value="RUB">RUB</option>
                <option value="USDT">USDT</option>
            </select>
        </div>

        <label class="input-label">Последнее начисление</label>
        <input type="number" id="lastNach" class="deposit-input" value="1360.46" style="width: 100%; margin-bottom: 12px;" oninput="calculateCurrent()">

        <label class="input-label">Кошелек</label>
        <input type="number" id="koshelek" class="deposit-input" value="51133.10" style="width: 100%;" oninput="calculateCurrent()">
        
        <div class="note" id="limitNote">* от 1 000 до ∞</div>
        <div id="error" class="error"></div>
    </div>

    <table id="resultTable">
        <thead>
            <tr>
                <th style="width: 18%;">Дата</th>
                <th style="width: 8%;">Дни</th>
                <th style="width: 14%;">Процент</th>
                <th style="width: 20%;">В потоке</th>
                <th style="width: 20%;">Начисление</th>
                <th style="width: 20%;">Кошелек</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const limits = {
        RUB: { min: 1000, symbol: '₽' },
        USDT: { min: 100, symbol: '₮' }
    };

    function formatNumber(num) {
        return num.toLocaleString('ru-RU', { 
            minimumFractionDigits: 2, 
            maximumFractionDigits: 2 
        });
    }

    function calculateCurrent() {
        const vpotokeInput = parseFloat(document.getElementById('vpotoke').value) || 0;
        const lastNachInput = parseFloat(document.getElementById('lastNach').value) || 0;
        const koshelekInput = parseFloat(document.getElementById('koshelek').value) || 0;
        const currency = document.getElementById('currency').value;
        const limit = limits[currency];

        const error = document.getElementById('error');
        const tbody = document.getElementById('tableBody');
        const table = document.getElementById('resultTable');

        tbody.innerHTML = '';

        if (vpotokeInput < limit.min) {
            error.style.display = 'block';
            error.textContent = `⚠ Сумма в потоке должна быть от ${limit.min.toLocaleString('ru-RU')} ${limit.symbol}`;
            table.style.display = 'none';
            return;
        } else {
            error.style.display = 'none';
        }

        table.style.display = 'table';

        let vPotoke = vpotokeInput;
        let koshelek = koshelekInput;
        let currentDate = new Date();

        // Текущий процент рассчитывается из последнего начисления
        let currentPercent = lastNachInput > 0 ? (lastNachInput / vPotoke) * 100 : 0.1;

        // Первая строка — текущее состояние
        let openRow = document.createElement('tr');
        openRow.classList.add('opening-row');
        openRow.innerHTML = `
            <td>ТЕКУЩИЙ</td>
            <td>-</td>
            <td class="pct">${currentPercent.toFixed(4)}%</td>
            <td class="vpotoke">${formatNumber(vPotoke)}</td>
            <td class="nach">${formatNumber(lastNachInput)}</td>
            <td class="koshelek">${formatNumber(koshelek)}</td>
        `;
        tbody.appendChild(openRow);

        let previousNachislenie = lastNachInput;

        for (let day = 1; day <= 180; day++) {
            while (currentDate.getDay() === 0) {
                currentDate.setDate(currentDate.getDate() + 1);
            }

            vPotoke -= previousNachislenie;
            koshelek += previousNachislenie;

            let nextPercent = currentPercent + day * 0.0033;
            let nachislenie = vPotoke * (nextPercent / 100);

            let dateStr = currentDate.toLocaleDateString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: '2-digit'
            });

            let row = document.createElement('tr');
            row.innerHTML = `
                <td>${dateStr}</td>
                <td>${day}</td>
                <td class="pct">${nextPercent.toFixed(4)}%</td>
                <td class="vpotoke">${formatNumber(vPotoke)}</td>
                <td class="nach">${formatNumber(nachislenie)}</td>
                <td class="koshelek">${formatNumber(koshelek)}</td>
            `;

            tbody.appendChild(row);

            previousNachislenie = nachislenie;
            currentDate.setDate(currentDate.getDate() + 1);

            if (vPotoke < 0.01) break;
        }
    }

    window.onload = () => {
        document.getElementById('resultTable').style.display = 'none';
        calculateCurrent();
    };
</script>
</body>
</html>
