<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Текущий РП - Растущий Поток</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #1e2937 100%);
            color: #e2e8f0;
            margin: 0;
            padding: 16px;
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 15px 0 30px;
        }

        .back-btn {
            position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            background: rgba(51, 65, 85, 0.8);
            color: white; 
            border: none; 
            border-radius: 50%;
            width: 44px; 
            height: 44px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            text-decoration: none;
            backdrop-filter: blur(8px);
        }

        h2 { 
            margin: 0; 
            font-size: 1.65rem; 
            font-weight: 700; 
            background: linear-gradient(90deg, #60a5fa, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .home-btn {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(51, 65, 85, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .main-card {
            background: #1e2937;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 24px;
            border: 1px solid #334155;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .deposit-input {
            width: 90%;
            padding: 16px 18px;
            background: #0f172a;
            border: 2px solid #475569;
            border-radius: 16px;
            color: white;
            font-size: 1.25rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .deposit-input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.15);
            outline: none;
        }

        .currency-select {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: #1e2937;
            border: 2px solid #475569;
            border-radius: 12px;
            color: white;
            padding: 8px 12px;
            font-size: 1.1rem;
        }

        .note {
            font-size: 0.85rem;
            color: #64748b;
            text-align: center;
            margin-top: 12px;
        }

        table {
            width: 100%; 
            border-collapse: collapse; 
            background: #1e2937;
            font-size: 10.5px; 
            border-radius: 20px; 
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        th {
            background: linear-gradient(135deg, #334155, #475569);
            color: #c4d0ff;
            padding: 14px 4px;
            font-weight: 600;
        }

        td {
            padding: 12px 4px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }

        tr:hover {
            background: #253549;
        }

        .pct { color: #a5b4fc; font-weight: 500; }
        .vpotoke { color: #fbbf24; font-weight: 600; }
        .nach { color: #34d399; font-weight: 600; }
        .koshelek { color: #60a5fa; font-weight: 600; }

        .opening-row {
            background: linear-gradient(90deg, #1e40af, #3b82f6) !important;
            color: white;
            font-weight: 700;
        }

        .error { 
            color: #f87171; 
            font-size: 0.95rem; 
            margin-top: 10px; 
            text-align: center; 
            display: none; 
        }

        .section-title {
            color: #60a5fa;
            font-size: 1.1rem;
            margin: 8px 0 16px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <a href="growing.html" class="back-btn">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
        
        <h2>Текущий РП</h2>

        <a href="index.html" class="home-btn">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>
    </div>

    <div class="main-card">
        <div class="section-title">Параметры потока</div>
        
        <div class="input-group">
            <label class="input-label">В потоке</label>
            <div class="input-wrapper">
                <input type="number" id="vpotoke" class="deposit-input" value="531427.84" oninput="calculateCurrent()">
                <select id="currency" class="currency-select" onchange="calculateCurrent()">
                    <option value="RUB">RUB</option>
                    <option value="USDT">USDT</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label class="input-label">Последнее начисление</label>
            <input type="number" id="lastNach" class="deposit-input" value="1360.46" oninput="calculateCurrent()">
        </div>

        <div class="input-group">
            <label class="input-label">На кошельке</label>
            <input type="number" id="koshelek" class="deposit-input" value="51133.10" oninput="calculateCurrent()">
        </div>

        <div class="note" id="limitNote">* минимальная сумма в потоке — 1 000</div>
        <div id="error" class="error"></div>
    </div>

    <table id="resultTable">
        <thead>
            <tr>
                <th style="width: 18%;">Дата</th>
                <th style="width: 8%;">Дни</th>
                <th style="width: 14%;">Процент</th>
                <th style="width: 20%;">В потоке</th>
                <th style="width: 20%;">Начисление</th>
                <th style="width: 20%;">Кошелек</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const limits = {
        RUB: { min: 1000, symbol: '₽' },
        USDT: { min: 100, symbol: '₮' }
    };

    function formatNumber(num) {
        return num.toLocaleString('ru-RU', { 
            minimumFractionDigits: 2, 
            maximumFractionDigits: 2 
        });
    }

    function calculateCurrent() {
        const vpotokeInput = parseFloat(document.getElementById('vpotoke').value) || 0;
        const lastNachInput = parseFloat(document.getElementById('lastNach').value) || 0;
        const koshelekInput = parseFloat(document.getElementById('koshelek').value) || 0;
        const currency = document.getElementById('currency').value;
        const limit = limits[currency];

        const error = document.getElementById('error');
        const tbody = document.getElementById('tableBody');
        const table = document.getElementById('resultTable');

        tbody.innerHTML = '';

        if (vpotokeInput < limit.min) {
            error.style.display = 'block';
            error.textContent = `⚠ Сумма в потоке должна быть от ${limit.min.toLocaleString('ru-RU')} ${limit.symbol}`;
            table.style.display = 'none';
            return;
        } else {
            error.style.display = 'none';
        }

        table.style.display = 'table';

        let vPotoke = vpotokeInput;
        let koshelek = koshelekInput;
        let currentDate = new Date();

        let currentPercent = lastNachInput > 0 ? (lastNachInput / vPotoke) * 100 : 0.1;

        let openRow = document.createElement('tr');
        openRow.classList.add('opening-row');
        openRow.innerHTML = `
            <td>ТЕКУЩИЙ</td>
            <td>-</td>
            <td class="pct">${currentPercent.toFixed(4)}%</td>
            <td class="vpotoke">${formatNumber(vPotoke)}</td>
            <td class="nach">${formatNumber(lastNachInput)}</td>
            <td class="koshelek">${formatNumber(koshelek)}</td>
        `;
        tbody.appendChild(openRow);

        let previousNachislenie = lastNachInput;

        for (let day = 1; day <= 180; day++) {
            while (currentDate.getDay() === 0) {
                currentDate.setDate(currentDate.getDate() + 1);
            }

            vPotoke -= previousNachislenie;
            koshelek += previousNachislenie;

            let nextPercent = currentPercent + day * 0.0033;
            let nachislenie = vPotoke * (nextPercent / 100);

            let dateStr = currentDate.toLocaleDateString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: '2-digit'
            });

            let row = document.createElement('tr');
            row.innerHTML = `
                <td>${dateStr}</td>
                <td>${day}</td>
                <td class="pct">${nextPercent.toFixed(4)}%</td>
                <td class="vpotoke">${formatNumber(vPotoke)}</td>
                <td class="nach">${formatNumber(nachislenie)}</td>
                <td class="koshelek">${formatNumber(koshelek)}</td>
            `;

            tbody.appendChild(row);

            previousNachislenie = nachislenie;
            currentDate.setDate(currentDate.getDate() + 1);

            if (vPotoke < 0.01) break;
        }
    }

    window.onload = () => {
        document.getElementById('resultTable').style.display = 'none';
        calculateCurrent();
    };
</script>
</body>
</html>
