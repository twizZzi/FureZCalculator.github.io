<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Текущий РП - Растущий Поток</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #1e2937 100%);
            color: #e2e8f0;
            margin: 0;
            padding: 16px;
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 15px 0 30px;
        }

        .back-btn, .home-btn {
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%);
            background: rgba(51, 65, 85, 0.9);
            color: white; 
            border: none; 
            border-radius: 50%;
            width: 44px; 
            height: 44px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            backdrop-filter: blur(8px);
        }

        .back-btn { left: 0; }
        .home-btn { right: 0; }

        h2 { 
            margin: 0; 
            font-size: 1.65rem; 
            font-weight: 700; 
            background: linear-gradient(90deg, #24a484, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .main-card {
            background: #1e2937;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 24px;
            border: 1px solid #334155;
        }

        .section-title {
            color: #24a484;
            font-size: 1.15rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .deposit-input {
            width: 88%;
            padding: 16px 18px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 16px;
            color: white;
            font-size: 1.25rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .deposit-input:focus {
            border-color: #24a484;
            box-shadow: 0 0 0 4px rgba(36, 164, 132, 0.2);
            outline: none;
        }

        /* Кнопки */
        .buttons-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .apply-btn {
            flex: 2;
            padding: 16px;
            background: linear-gradient(135deg, #24a484, #34d399);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .apply-btn:active {
            transform: scale(0.97);
        }

        .clear-btn {
            flex: 1;
            padding: 16px;
            background: transparent;
            color: #94a3b8;
            border: 2px solid #475569;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .clear-btn:active {
            transform: scale(0.97);
            background: rgba(71, 85, 105, 0.2);
        }

        /* ===================== ТАБЛИЦА ===================== */
        table {
            width: 100%; 
            border-collapse: collapse; 
            background: #1e2937;
            font-size: 10.5px; 
            border-radius: 20px; 
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        th {
            background: #24a484;
            color: white;
            padding: 13px 6px;
            font-weight: 600;
            text-align: center;
        }

        td {
            padding: 12px 6px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }

        tbody tr:nth-child(odd) {
            background: #1e2937;
        }
        tbody tr:nth-child(even) {
            background: #25334a;
        }

        tr:hover {
            background: #2f4a6b !important;
        }

        /* Спокойное выделение строки "ТЕКУЩИЙ" */
        .opening-row {
            background: rgba(36, 164, 132, 0.25) !important;
            color: #e2e8f0;
            font-weight: 700;
        }

        .pct { color: #a5b4fc; font-weight: 500; }
        .vpotoke { color: #fcd34d; font-weight: 600; }
        .nach { color: #34d399; font-weight: 600; }
        .koshelek { color: #60a5fa; font-weight: 600; }

        .error { 
            color: #f87171; 
            font-size: 0.95rem; 
            margin-top: 12px; 
            text-align: center; 
            display: none; 
        }
    </style>
</head>
<body>

    <div class="header-container">
        <a href="growing.html" class="back-btn">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
        
        <h2>Текущий РП</h2>

        <a href="index.html" class="home-btn">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>
    </div>

    <div class="main-card">
        <div class="section-title">Параметры потока</div>
        
        <div class="input-group">
            <label class="input-label">Текущая сумма в потоке</label>
            <input type="number" id="vpotoke" class="deposit-input" placeholder="0.00" 
                   onfocus="this.placeholder=''" onblur="if(!this.value) this.placeholder='0.00'" oninput="clearTable()">
        </div>

        <div class="input-group">
            <label class="input-label">Текущее начисление</label>
            <input type="number" id="lastNach" class="deposit-input" placeholder="0.00" 
                   onfocus="this.placeholder=''" onblur="if(!this.value) this.placeholder='0.00'" oninput="clearTable()">
        </div>

        <div class="input-group">
            <label class="input-label">Сейчас в кошельке</label>
            <input type="number" id="koshelek" class="deposit-input" placeholder="0.00" 
                   onfocus="this.placeholder=''" onblur="if(!this.value) this.placeholder='0.00'" oninput="clearTable()">
        </div>

        <div class="buttons-container">
            <button class="apply-btn" onclick="calculateCurrent()">Применить</button>
            <button class="clear-btn" onclick="clearAll()">Очистить</button>
        </div>

        <div id="error" class="error"></div>
    </div>

    <table id="resultTable" style="display: none;">
        <thead>
            <tr>
                <th style="width: 18%;">Дата</th>
                <th style="width: 8%;">Дни</th>
                <th style="width: 14%;">Процент</th>
                <th style="width: 20%;">В потоке</th>
                <th style="width: 20%;">Начисление</th>
                <th style="width: 20%;">Кошелек</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function formatNumber(num) {
        return num.toLocaleString('ru-RU', { 
            minimumFractionDigits: 2, 
            maximumFractionDigits: 2 
        });
    }

    function clearTable() {
        document.getElementById('resultTable').style.display = 'none';
        document.getElementById('error').style.display = 'none';
    }

    function clearAll() {
        document.getElementById('vpotoke').value = '';
        document.getElementById('lastNach').value = '';
        document.getElementById('koshelek').value = '';
        clearTable();
    }

    function calculateCurrent() {
        let vpotoke = parseFloat(document.getElementById('vpotoke').value) || 0;
        let lastNach = parseFloat(document.getElementById('lastNach').value) || 0;
        let koshelek = parseFloat(document.getElementById('koshelek').value) || 0;

        const error = document.getElementById('error');
        const tbody = document.getElementById('tableBody');
        const table = document.getElementById('resultTable');

        tbody.innerHTML = '';
        error.style.display = 'none';

        if (vpotoke <= 0 || lastNach <= 0 || koshelek < 0) {
            error.style.display = 'block';
            error.textContent = 'Все поля должны быть заполнены положительными числами';
            return;
        }

        if (lastNach >= vpotoke) {
            error.style.display = 'block';
            error.textContent = 'Начисление не может быть больше или равно сумме в потоке';
            return;
        }

        table.style.display = 'table';

        let currentDate = new Date();
        let currentPercent = (lastNach / vpotoke) * 100;

        let openRow = document.createElement('tr');
        openRow.classList.add('opening-row');
        openRow.innerHTML = `
            <td>ТЕКУЩИЙ</td>
            <td>-</td>
            <td class="pct">${currentPercent.toFixed(4)}%</td>
            <td class="vpotoke">${formatNumber(vpotoke)}</td>
            <td class="nach">${formatNumber(lastNach)}</td>
            <td class="koshelek">${formatNumber(koshelek)}</td>
        `;
        tbody.appendChild(openRow);

        let previousNachislenie = lastNach;

        for (let day = 1; day <= 180; day++) {
            while (currentDate.getDay() === 0) {
                currentDate.setDate(currentDate.getDate() + 1);
            }

            vpotoke -= previousNachislenie;
            koshelek += previousNachislenie;

            if (vpotoke < 0) vpotoke = 0;

            let nextPercent = currentPercent + day * 0.0033;
            let nachislenie = vpotoke * (nextPercent / 100);

            let dateStr = currentDate.toLocaleDateString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: '2-digit'
            });

            let row = document.createElement('tr');
            row.innerHTML = `
                <td>${dateStr}</td>
                <td>${day}</td>
                <td class="pct">${nextPercent.toFixed(4)}%</td>
                <td class="vpotoke">${formatNumber(vpotoke)}</td>
                <td class="nach">${formatNumber(nachislenie)}</td>
                <td class="koshelek">${formatNumber(koshelek)}</td>
            `;

            tbody.appendChild(row);

            previousNachislenie = nachislenie;
            currentDate.setDate(currentDate.getDate() + 1);

            if (vpotoke < 0.01) break;
        }
    }
</script>
</body>
</html>
