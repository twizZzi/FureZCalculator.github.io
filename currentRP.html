<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Текущий РП</title>

<style>
body {
    font-family: sans-serif;
    background: linear-gradient(180deg, #0f172a, #334155);
    color: white;
    padding: 16px;
    max-width: 420px;
    margin: auto;
}

.card {
    background: #1e2937;
    padding: 20px;
    border-radius: 16px;
    border: 1px solid #334155;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 2px solid #334155;
    background: #0f172a;
    color: white;
    text-align: center;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    background: #334155;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
    background: #1e2937;
}

th, td {
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid #334155;
}

th {
    background: #334155;
}

tr:nth-child(even) {
    background: #293548;
}

.opening {
    background: #334155;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="card">
    <h3>Параметры потока</h3>

    <input id="vpotoke" placeholder="0.00">
    <input id="lastNach" placeholder="0.00">
    <input id="koshelek" placeholder="0.00">

    <button onclick="calculate()">Применить</button>
</div>

<table id="table" style="display:none;">
<thead>
<tr>
<th>Дата</th>
<th>День</th>
<th>%</th>
<th>Поток</th>
<th>Начисление</th>
<th>Кошелек</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>
// ===== автоформат =====
function formatInput(value) {
    value = value.replace(/\s/g, '').replace(',', '.');
    if (!value) return '';
    return Number(value).toLocaleString('ru-RU', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

function parseValue(value) {
    return parseFloat(value.replace(/\s/g, '').replace(',', '.')) || 0;
}

document.querySelectorAll("input").forEach(input => {

    input.addEventListener("focus", () => {
        if (input.value === "0.00") input.value = "";
        input.placeholder = "";
    });

    input.addEventListener("blur", () => {
        if (!input.value) {
            input.placeholder = "0.00";
            return;
        }
        input.value = formatInput(input.value);
    });

});

// ===== расчет =====
function calculate() {

    let vpotoke = parseValue(document.getElementById('vpotoke').value);
    let lastNach = parseValue(document.getElementById('lastNach').value);
    let koshelek = parseValue(document.getElementById('koshelek').value);

    const tbody = document.getElementById('tbody');
    const table = document.getElementById('table');

    tbody.innerHTML = '';

    if (vpotoke <= 0 || lastNach < 0 || koshelek < 0) {
        table.style.display = 'none';
        return;
    }

    table.style.display = 'table';

    let date = new Date();
    let percent = (lastNach / vpotoke) * 100;

    // текущий
    tbody.innerHTML += `
    <tr class="opening">
        <td>ТЕКУЩИЙ</td>
        <td>-</td>
        <td>${percent.toFixed(4)}%</td>
        <td>${formatInput(vpotoke.toString())}</td>
        <td>${formatInput(lastNach.toString())}</td>
        <td>${formatInput(koshelek.toString())}</td>
    </tr>
    `;

    let prev = lastNach;

    for (let day = 1; day <= 180; day++) {

        if (date.getDay() === 0) {
            date.setDate(date.getDate() + 1);
            continue;
        }

        vpotoke -= prev;
        koshelek += prev;

        let newPercent = percent + day * 0.0033;
        let nach = vpotoke * (newPercent / 100);

        tbody.innerHTML += `
        <tr>
            <td>${date.toLocaleDateString('ru-RU')}</td>
            <td>${day}</td>
            <td>${newPercent.toFixed(4)}%</td>
            <td>${formatInput(vpotoke.toString())}</td>
            <td>${formatInput(nach.toString())}</td>
            <td>${formatInput(koshelek.toString())}</td>
        </tr>
        `;

        prev = nach;
        date.setDate(date.getDate() + 1);

        if (vpotoke < 0.01) break;
    }
}
</script>

</body>
</html>
