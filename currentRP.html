<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Текущий РП - Растущий Поток</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 16px;
            max-width: 430px;
            margin: 0 auto;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 10px 0 25px;
        }

        .back-btn, .home-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: #334155;
            color: white;
            border: none;
            border-radius: 12px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }

        .back-btn { left: 0; }
        .home-btn { right: 0; }

        .home-btn:active, .back-btn:active {
            background: #475569;
            transform: translateY(-50%) scale(0.9);
        }

        h2 { 
            margin: 0; 
            font-size: 1.45rem; 
            color: #c4d0ff; 
            text-align: center; 
        }

        .card {
            background: #1e2937;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 22px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .deposit-input {
            width: 100%;
            padding: 16px 14px;
            background: #334155;
            border: 2px solid #24a484;
            border-radius: 14px;
            color: white;
            font-size: 1.1rem;
            text-align: center;
        }

        .currency-select {
            width: 100%;
            padding: 16px 14px;
            background: #334155;
            border: 2px solid #24a484;
            border-radius: 14px;
            color: white;
            font-size: 1.1rem;
            text-align: center;
            margin-top: 8px;
        }

        .note {
            font-size: 0.86rem;
            color: #64748b;
            text-align: center;
            margin-top: 12px;
        }

        table {
            width: 100%; 
            border-collapse: collapse; 
            background: #1e2937;
            font-size: 10px; 
            border-radius: 14px; 
            overflow: hidden;
            table-layout: fixed;
        }

        th, td { 
            padding: 9px 4px; 
            text-align: center; 
            border-bottom: 1px solid #475569; 
        }
        th { 
            background: #334155; 
            color: #c4d0ff; 
            font-weight: 600;
        }

        .pct { color: #a5b4fc; }
        .vpotoke { color: #fbbf24; }
        .opening-row { 
            background-color: #334155 !important; 
            font-weight: bold; 
        }
        .nach { color: #34d399; font-weight: bold; }
        .koshelek { color: #60a5fa; font-weight: bold; }

        .error { 
            color: #f87171; 
            font-size: 0.9rem; 
            margin-top: 10px; 
            text-align: center; 
            display: none; 
        }
    </style>
</head>
<body>

    <div class="header-container">
        <a href="growing.html" class="back-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
        
        <h2>Текущий РП</h2>

        <a href="index.html" class="home-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>
    </div>

    <div class="card">
        <div class="input-group">
            <label class="input-label">Сумма в потоке</label>
            <div class="input-wrapper">
                <input type="number" id="vpotoke" class="deposit-input" value="531427.84" oninput="calculateCurrent()">
            </div>
            <select id="currency" class="currency-select" onchange="calculateCurrent()">
                <option value="RUB">RUB</option>
                <option value="USDT">USDT</option>
            </select>
        </div>

        <div class="input-group">
            <label class="input-label">Последнее начисление</label>
            <input type="number" id="lastNach" class="deposit-input" value="1360.46" oninput="calculateCurrent()">
        </div>

        <div class="input-group">
            <label class="input-label">На кошельке</label>
            <input type="number" id="koshelek" class="deposit-input" value="51133.10" oninput="calculateCurrent()">
        </div>

        <div class="note" id="limitNote">* Минимальная сумма в потоке — 1 000</div>
        <div id="error" class="error"></div>
    </div>

    <table id="resultTable">
        <thead>
            <tr>
                <th style="width: 18%;">Дата</th>
                <th style="width: 8%;">Дни</th>
                <th style="width: 14%;">Процент</th>
                <th style="width: 20%;">В потоке</th>
                <th style="width: 20%;">Начисление</th>
                <th style="width: 20%;">Кошелек</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const limits = {
        RUB: { min: 1000, symbol: '₽' },
        USDT: { min: 100, symbol: '₮' }
    };

    function formatNumber(num) {
        return num.toLocaleString('ru-RU', { 
            minimumFractionDigits: 2, 
            maximumFractionDigits: 2 
        });
    }

    function calculateCurrent() {
        const vpotoke = parseFloat(document.getElementById('vpotoke').value) || 0;
        const lastNach = parseFloat(document.getElementById('lastNach').value) || 0;
        const koshelek = parseFloat(document.getElementById('koshelek').value) || 0;
        const currency = document.getElementById('currency').value;
        const limit = limits[currency];

        const error = document.getElementById('error');
        const tbody = document.getElementById('tableBody');
        const table = document.getElementById('resultTable');

        tbody.innerHTML = '';

        if (vpotoke < limit.min) {
            error.style.display = 'block';
            error.textContent = `⚠ Сумма в потоке должна быть от ${limit.min.toLocaleString('ru-RU')} ${limit.symbol}`;
            table.style.display = 'none';
            return;
        } else {
            error.style.display = 'none';
        }

        table.style.display = 'table';

        let vPotoke = vpotoke;
        let currentKoshelek = koshelek;
        let currentDate = new Date();

        let currentPercent = lastNach > 0 ? (lastNach / vPotoke) * 100 : 0.1;

        // Первая строка — текущее состояние
        let openRow = document.createElement('tr');
        openRow.classList.add('opening-row');
        openRow.innerHTML = `
            <td>ТЕКУЩИЙ</td>
            <td>-</td>
            <td class="pct">${currentPercent.toFixed(4)}%</td>
            <td class="vpotoke">${formatNumber(vPotoke)}</td>
            <td class="nach">${formatNumber(lastNach)}</td>
            <td class="koshelek">${formatNumber(currentKoshelek)}</td>
        `;
        tbody.appendChild(openRow);

        let previousNachislenie = lastNach;

        for (let day = 1; day <= 180; day++) {
            while (currentDate.getDay() === 0) {
                currentDate.setDate(currentDate.getDate() + 1);
            }

            vPotoke -= previousNachislenie;
            currentKoshelek += previousNachislenie;

            let nextPercent = currentPercent + day * 0.0033;
            let nachislenie = vPotoke * (nextPercent / 100);

            let dateStr = currentDate.toLocaleDateString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: '2-digit'
            });

            let row = document.createElement('tr');
            row.innerHTML = `
                <td>${dateStr}</td>
                <td>${day}</td>
                <td class="pct">${nextPercent.toFixed(4)}%</td>
                <td class="vpotoke">${formatNumber(vPotoke)}</td>
                <td class="nach">${formatNumber(nachislenie)}</td>
                <td class="koshelek">${formatNumber(currentKoshelek)}</td>
            `;

            tbody.appendChild(row);
            previousNachislenie = nachislenie;
            currentDate.setDate(currentDate.getDate() + 1);

            if (vPotoke < 0.01) break;
        }
    }

    window.onload = () => {
        document.getElementById('resultTable').style.display = 'none';
        calculateCurrent();
    };
</script>
</body>
</html>
