<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Поток Новичка - FureZ Calculator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        margin: 0;
        padding: 16px;
        max-width: 430px;
        margin: 0 auto;
    }

    .header-container {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        margin: 10px 0 25px;
    }

    .back-btn, .home-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: #334155;
        color: white;
        border: none;
        border-radius: 12px;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
    }

    .back-btn { left: 0; }
    .home-btn { right: 0; }

    .back-btn:active, .home-btn:active {
        background: #475569;
        transform: translateY(-50%) scale(0.9);
    }

    h2 {
        margin: 0;
        font-size: 1.4rem;
        color: #c4d0ff;
        text-align: center;
    }

    .card {
        background: #1e2937;
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 22px;
        box-sizing: border-box;
    }

    .info {
        background: #1e2937;
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 22px;
        font-size: 1.2rem;
        text-align: center;
        line-height: 1.65;
    }

    .deposit-label {
        display: block;
        margin-bottom: 10px;
        color: #94a3b8;
        font-size: 0.97rem;
    }

    .deposit-row {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .deposit-input {
        flex: 1;
        padding: 16px 14px;
        background: #334155;
        border: 2px solid #3b82f6;
        border-radius: 14px;
        color: white;
        font-size: 1.1rem;
        text-align: center;
        width: 184px;           /* ← Вернул */
    }

    .deposit-input:focus {
        border-color: #60a5fa;
    }

    .currency-select {
        flex: 1;
        padding: 16px 10px;
        background: #334155;
        border: 2px solid #3b82f6;
        border-radius: 14px;
        color: white;
        font-size: 1.1rem;
        text-align: center;
    }

    .note { font-size: 0.86rem; color: #64748b; margin-top: 10px; }
    .error { color: #f87171; font-size: 0.9rem; margin-top: 8px; text-align: center; display: none; }

    .ecr-rate {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #475569;
        font-size: 1.05rem;
    }
    .ecr-rate span { color: #60a5fa; font-weight: 600; }

    .refresh-btn {
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 12px;
        padding: 10px 16px;
        font-size: 0.95rem;
        cursor: pointer;
        margin-top: 8px;
        width: 100%;
    }
    .refresh-btn:active { background: #2563eb; transform: scale(0.98); }

    .last-update { font-size: 0.8rem; color: #64748b; margin-top: 4px; }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #1e2937;
        font-size: 11.5px;
        border-radius: 14px;
        overflow: hidden;
        margin-top: 8px;
        table-layout: fixed;
    }

    th, td { padding: 10px 2px; text-align: center; border-bottom: 1px solid #475569; }
    th { background: #334155; color: #c4d0ff; font-weight: 600; }
    th:nth-child(1) { width: 22%; }
    th:nth-child(2) { width: 12%; }
    th:nth-child(3) { width: 22%; }
    th:nth-child(4) { width: 22%; }
    th:nth-child(5) { width: 22%; }

    tbody tr:nth-child(even) { background-color: #252f3f; }
    .opening-row { background-color: #334155 !important; font-weight: bold; }

    .nach { color: #34d399; font-weight: bold; }
    .koshelek { color: #60a5fa; font-weight: bold; }
    .vpotoke { color: #fbbf24; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-container">
        <a href="novicePotok.html" class="back-btn">←</a>
        <h2>Первое открытие ПН</h2>
        <a href="index.html" class="home-btn">🏠</a>
    </div>

    <div class="card">
        <label class="deposit-label">Депозит</label>
        <div class="deposit-row">
            <input type="number" id="deposit" class="deposit-input" value="100000" oninput="validateAndCalculate()">
            <select id="currency" class="currency-select" onchange="validateAndCalculate()">
                <option value="RUB">RUB</option>
                <option value="USDT">USDT</option>
                <option value="EUR">EURO</option>
                <option value="CNY">CNY</option>
            </select>
        </div>
        <div class="note" id="limitNote">* от 2 000 до 200 000 RUB</div>
        <div id="depositError" class="error"></div>
    </div>

    <div class="info">
        Сумма в потоке = Депозит + 50%<br>
        <strong id="vPotokeInfo">150 000.00</strong>

        <div class="ecr-rate">
            Курс 1 ECR = <span id="ecrRate">—</span> ₽
            <div class="last-update" id="lastUpdate"></div>
        </div>

        <button class="refresh-btn" onclick="updateECRRate()">🔄 Обновить курс</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Дата</th>
                <th>День</th>
                <th class="vpotoke">В потоке</th>
                <th class="nach">Начисление</th>
                <th class="koshelek">Кошелек</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let currentECRRate = null;

    const limits = { /* ... без изменений ... */
        RUB: { min: 2000, max: 500000, symbol: '₽' },
        USDT: { min: 20, max: 2000, symbol: '₮' },
        EUR: { min: 20, max: 2000, symbol: '€' },
        CNY: { min: 160, max: 16000, symbol: '¥' }
    };

    function formatNumber(num) {
        return num.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // ==================== КУРС ECR ====================
    async function updateECRRate() {
        const rateEl = document.getElementById('ecrRate');
        const updateEl = document.getElementById('lastUpdate');

        rateEl.textContent = "Загрузка...";

        try {
            // Используем CORS-прокси
            const proxy = 'https://corsproxy.io/?';
            const url = 'https://sberkassa.site/public_deals/fetch?offset=0&limit=3&to=RUB&from=ECR';
            
            const res = await fetch(proxy + encodeURIComponent(url));
            
            if (!res.ok) throw new Error('Network error');

            const json = await res.json();

            if (json.result === 'ok' && json.data?.length > 0) {
                currentECRRate = parseFloat(json.data[0].back_rate);
                const now = Date.now();

                localStorage.setItem('ecr_rate', currentECRRate);
                localStorage.setItem('ecr_last_update', now);

                rateEl.textContent = currentECRRate.toLocaleString('ru-RU');
                updateEl.textContent = `Обновлено: только что`;
            } else {
                throw new Error('Bad data');
            }
        } catch (e) {
            console.error(e);
            rateEl.textContent = "—";
            updateEl.textContent = "Ошибка загрузки (попробуйте ещё раз)";
        }
    }

    function loadSavedRate() {
        const savedRate = localStorage.getItem('ecr_rate');
        const savedTime = localStorage.getItem('ecr_last_update');

        if (savedRate && savedTime) {
            currentECRRate = parseFloat(savedRate);
            document.getElementById('ecrRate').textContent = currentECRRate.toLocaleString('ru-RU');

            const hoursAgo = (Date.now() - parseInt(savedTime)) / (1000 * 60 * 60);
            document.getElementById('lastUpdate').textContent = `Обновлено: ${hoursAgo.toFixed(1)} ч. назад`;

            if (hoursAgo > 12) updateECRRate();
        } else {
            updateECRRate();
        }
    }

    // ==================== Остальная логика (без изменений) ====================
    function validateAndCalculate() {
        const depositInput = document.getElementById('deposit');
        const currencySelect = document.getElementById('currency');
        const errorDiv = document.getElementById('depositError');
        const noteDiv = document.getElementById('limitNote');
        const table = document.querySelector('table');
        const vPotokeInfo = document.getElementById('vPotokeInfo');

        const currency = currencySelect.value;
        const limit = limits[currency];
        let deposit = parseFloat(depositInput.value) || 0;

        noteDiv.textContent = `* от ${limit.min.toLocaleString('ru-RU')} до ${limit.max.toLocaleString('ru-RU')} ${limit.symbol}`;

        const isValid = deposit >= limit.min && deposit <= limit.max && deposit > 0;

        if (!isValid) {
            errorDiv.style.display = 'block';
            errorDiv.textContent = `⚠ Сумма должна быть от ${limit.min.toLocaleString('ru-RU')} до ${limit.max.toLocaleString('ru-RU')} ${limit.symbol}`;
            table.style.display = 'none';
            return;
        } 

        errorDiv.style.display = 'none';
        table.style.display = 'table';
        calculateNovice(deposit);
    }

    function calculateNovice(deposit) {
        const percent = 0.02;
        const maxDays = 180;
        let initialVPotoke = deposit * 1.5;
        let vPotoke = initialVPotoke;
        let koshelek = 0;
        let dayCount = 0;

        document.getElementById('vPotokeInfo').textContent = formatNumber(initialVPotoke);

        let tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        let firstAccrual = initialVPotoke * percent;
        let openRow = document.createElement('tr');
        openRow.classList.add('opening-row');
        openRow.innerHTML = `
            <td>ОТКРЫТИЕ</td>
            <td>-</td>
            <td class="vpotoke">${formatNumber(initialVPotoke)}</td>
            <td class="nach">${formatNumber(firstAccrual)}</td>
            <td class="koshelek">0.00</td>
        `;
        tbody.appendChild(openRow);

        let currentDate = new Date();

        while (dayCount < maxDays) {
            if (currentDate.getDay() === 0) {
                currentDate.setDate(currentDate.getDate() + 1);
                continue;
            }
            dayCount++;
            let nachislenie = vPotoke * percent;
            koshelek += nachislenie;
            vPotoke -= nachislenie;

            let dateStr = currentDate.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });

            let row = document.createElement('tr');
            row.innerHTML = `
                <td>${dateStr}</td>
                <td>${dayCount}</td>
                <td class="vpotoke">${formatNumber(vPotoke)}</td>
                <td class="nach">${formatNumber(vPotoke * percent)}</td>
                <td class="koshelek">${formatNumber(koshelek)}</td>
            `;
            tbody.appendChild(row);

            if (vPotoke < 0.01) break;
            currentDate.setDate(currentDate.getDate() + 1);
        }
    }

    window.onload = () => {
        document.querySelector('table').style.display = 'none';
        validateAndCalculate();
        loadSavedRate();
    };
</script>
</html>
